name: Sprout bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python sprout_bot.py
        env:
          RUN_ONCE: "1"
          ROBLOX_KEY: ${{ secrets.ROBLOX_KEY }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
